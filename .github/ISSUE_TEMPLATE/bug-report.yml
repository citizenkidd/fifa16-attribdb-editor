name: Bug report
description: Report a reproducible problem with FIFA 16 AttribDB Editor
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - AttribDB
        - AttribDB Gameplay
        - Not selected or unknown
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: For example, Microsoft Edge 140
    validations:
      required: true

  - type: dropdown
    id: file_source
    attributes:
      label: Input files
      options:
        - Built-in original
        - Existing modified BIN/VLT pair
        - Other or unknown
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the smallest sequence that reliably causes the problem.
      placeholder: |
        1. Open the editor
        2. Select...
        3. Change...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result and complete error message
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: File-sharing confirmation
      options:
        - label: I will not upload copyrighted game files or private mods without permission.
          required: true
